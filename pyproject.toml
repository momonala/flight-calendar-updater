[project]
name = "flight-calendar-updater"
version = "0.1.0"
description = ""
authors = [
    {name = "momonala", email = "mnalavadi@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "airportsdata",
    "aniso8601>=10.0.1",
    "google-api-python-client>=2.0.0,<3.0.0",
    "google-auth>=2.62.0",
    "openai>=3.31.0",
    "pandas>=3.0.6",
    "playwright>=1.64.0",
    "pycountry>=24.0.0,<25.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.2.4",
    "pytz",
    "requests>=2.0.0,<3.0.0",
    "schedule",
    "typer>=0.27.3",
]

[tool.config]
# Non-secret config; secrets (SPREADSHEET_ID, CALENDAR_ID, OPENAI_API_KEY) come from env vars
openai_model = "gpt-6.1-sol"
scheduler_trigger_time = "10:00"
range_name = "raw!A:ZZ"
service_account_file = "google_application_credentials.json"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
main = "src.main:app"
config = "src.config:main"


[tool.black]
line-length = 110
target-version = ['py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-s -v --cov=src --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { certifi = false }

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF100", "PLW1510"]
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.isort]
force-single-line = true
